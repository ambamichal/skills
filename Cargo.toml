[package]
name = "autodev"
version = "0.2.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Supervised issue-to-PR development in isolated Git worktrees"
repository = "https://github.com/ambamichal/autodev"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
