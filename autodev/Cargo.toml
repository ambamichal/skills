[package]
name = "autodev"
version = "0.2.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Supervised issue-to-PR development in isolated Git worktrees"
repository = "https://github.com/ambamichal/skills"
readme = "README.md"
include = ["src/**", "tests/**", "workflow/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "autodev.example.json"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
